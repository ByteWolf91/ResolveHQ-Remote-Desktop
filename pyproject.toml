[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvehq-remote-desktop"
version = "0.1.0"
description = "Attended remote support desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "mss>=9", "pynput>=1.7", "Pillow>=10"]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
resolvehq = "resolvehq.app:main"
resolvehq-relay = "resolvehq.relay:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["resolvehq*"]
